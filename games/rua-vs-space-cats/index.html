<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rua vs Space Cats 🐕🚀</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            max-height: 800px;
            background: #000;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
        }
        .loading-text {
            font-size: 2em;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="loadingScreen">
            <div class="loading-text">🐕 Loading Rua vs Space Cats 🚀</div>
        </div>
    </div>
    <script src="src/systems/saveSystem.js"></script>
    <script src="src/systems/audioSystem.js"></script>
    <script src="src/systems/dialogueSystem.js?v=20260306002"></script>
    <script src="src/systems/transitionSystem.js"></script>
    <script src="src/systems/inputSystem.js"></script>
    <script src="src/cutscenes/cutsceneManager.js"></script>
    <script src="src/levels/level00_opening.js"></script>
    <script src="src/levels/level01_space.js"></script>
    <script src="src/levels/level02_spacecombat.js?v=20260306001"></script>
    <script src="src/levels/level03_jungle.js?v=20260306001"></script>
    <script src="src/levels/level04_village.js?v=20260306002"></script>
    <script src="src/levels/level05_bee_house.js"></script>
    <script src="src/levels/level06_mountain.js"></script>
    <script src="src/levels/level07_servants.js"></script>
    <script src="src/levels/level08_office.js"></script>
    <script src="src/levels/level09_flight.js"></script>
    <script src="src/levels/level10_ocean.js"></script>
    <script src="src/levels/level11_return.js"></script>
    <script src="src/levels/level12_final_boss.js"></script>
    <script src="src/game.js?v=20260306001"></script>
</body>
</html>
